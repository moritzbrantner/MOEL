[package]
name = "moel"
version = "0.1.0"
edition = "2024"
description = "A small TOML-superset data language with explicit typed primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moritzbrantner/MOEL"

[dependencies]
toml = "0.9"
uuid = { version = "1", features = ["std"] }

[dev-dependencies]
pretty_assertions = "1"
